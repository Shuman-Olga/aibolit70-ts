name: CI

on:
  push:
    branches:
      - main
      - feature/mobile-home-hover
      - refactor/unified-route-config
      - refactor/content-types
  pull_request:
    branches:
      - refactor/unified-route-config

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
